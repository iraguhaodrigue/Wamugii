<svg width="560" height="460" viewBox="0 0 560 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gMix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="blurbig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <circle cx="160" cy="150" r="95" fill="#2DD4BF" opacity="0.20" filter="url(#blurbig)"/>
  <circle cx="420" cy="340" r="110" fill="#8B5CF6" opacity="0.18" filter="url(#blurbig)"/>

  <!-- cloud -->
  <g filter="url(#soft)">
    <path d="M196 150 a40 40 0 0 1 78 -10 a30 30 0 0 1 20 56 h-96 a33 33 0 0 1 -2 -46 z" fill="url(#gMix)"/>
    <path d="M226 126 a24 24 0 0 1 44 6" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  </g>

  <!-- connecting line cloud -> server -->
  <path d="M250 196 v26" stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"/>

  <!-- server rack card -->
  <g filter="url(#soft)">
    <rect x="150" y="224" width="200" height="150" rx="16" fill="#FFFFFF"/>
    <rect x="172" y="246" width="156" height="30" rx="8" fill="#F1F5F9"/>
    <circle cx="190" cy="261" r="6" fill="url(#gTeal)"/>
    <rect x="206" y="257" width="70" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="172" y="286" width="156" height="30" rx="8" fill="#F1F5F9"/>
    <circle cx="190" cy="301" r="6" fill="url(#gPurple)"/>
    <rect x="206" y="297" width="90" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="172" y="326" width="156" height="30" rx="8" fill="#F1F5F9"/>
    <circle cx="190" cy="341" r="6" fill="url(#gTeal)"/>
    <rect x="206" y="337" width="54" height="8" rx="4" fill="#E2E8F0"/>
  </g>

  <!-- uptime graph card -->
  <g filter="url(#soft)">
    <rect x="356" y="92" width="150" height="104" rx="14" fill="#FFFFFF"/>
    <rect x="374" y="110" width="60" height="9" rx="4.5" fill="#E2E8F0"/>
    <text x="488" y="120" font-family="Arial, sans-serif" font-size="13" fill="#10B981" text-anchor="end" font-weight="700">99.9%</text>
    <polyline points="374,172 398,158 422,164 446,140 470,150 494,126" fill="none" stroke="url(#gMix)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="494" cy="126" r="4.5" fill="#06B6D4"/>
  </g>

  <!-- SSL shield -->
  <g filter="url(#soft)">
    <rect x="372" y="256" width="146" height="76" rx="14" fill="#FFFFFF"/>
    <path d="M404 272 l18 6 v14 c0 12 -9 20 -18 24 c-9 -4 -18 -12 -18 -24 v-14 z" fill="url(#gTeal)"/>
    <path d="M397 296 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="432" y="280" width="72" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="432" y="298" width="48" height="8" rx="4" fill="#EEF2F6"/>
  </g>

  <!-- domain chip -->
  <g filter="url(#soft)">
    <rect x="60" y="300" width="104" height="60" rx="14" fill="#0F172A"/>
    <text x="112" y="337" font-family="monospace" font-size="20" fill="#2DD4BF" text-anchor="middle" font-weight="700">.rw</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.55">
    <path d="M350 300 C 420 300, 420 300, 430 332" fill="none"/>
  </g>
  <circle cx="540" cy="220" r="5" fill="#2DD4BF" opacity="0.7"/>
  <circle cx="92" cy="110" r="6" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="300" cy="412" r="5" fill="#06B6D4" opacity="0.6"/>
</svg>
