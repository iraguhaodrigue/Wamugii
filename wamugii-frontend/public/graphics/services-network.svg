<svg width="560" height="460" viewBox="0 0 560 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gMix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="blurbig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <circle cx="280" cy="230" r="120" fill="#06B6D4" opacity="0.16" filter="url(#blurbig)"/>
  <circle cx="430" cy="120" r="80" fill="#8B5CF6" opacity="0.16" filter="url(#blurbig)"/>

  <!-- connecting lines hub -> satellites -->
  <g stroke="url(#gMix)" stroke-width="2.5" stroke-linecap="round" opacity="0.5">
    <line x1="280" y1="230" x2="120" y2="104"/>
    <line x1="280" y1="230" x2="450" y2="104"/>
    <line x1="280" y1="230" x2="86" y2="246"/>
    <line x1="280" y1="230" x2="476" y2="250"/>
    <line x1="280" y1="230" x2="150" y2="376"/>
    <line x1="280" y1="230" x2="416" y2="376"/>
  </g>

  <!-- central hub -->
  <g filter="url(#soft)">
    <circle cx="280" cy="230" r="54" fill="url(#gMix)"/>
    <circle cx="280" cy="230" r="54" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.35"/>
    <text x="280" y="246" font-family="Arial, sans-serif" font-size="40" fill="#FFFFFF" text-anchor="middle" font-weight="800">W</text>
  </g>

  <!-- satellite: web (globe) -->
  <g filter="url(#soft)">
    <rect x="70" y="66" width="100" height="76" rx="16" fill="#FFFFFF"/>
    <circle cx="104" cy="104" r="16" fill="none" stroke="url(#gTeal)" stroke-width="3"/>
    <path d="M88 104 h32 M104 88 v32 M93 94 q11 10 22 0 M93 114 q11 -10 22 0" stroke="url(#gTeal)" stroke-width="2.4" fill="none"/>
    <rect x="130" y="96" width="30" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="130" y="110" width="20" height="7" rx="3.5" fill="#EEF2F6"/>
  </g>

  <!-- satellite: code -->
  <g filter="url(#soft)">
    <rect x="398" y="66" width="104" height="76" rx="16" fill="#FFFFFF"/>
    <rect x="416" y="88" width="34" height="34" rx="9" fill="#0F172A"/>
    <text x="433" y="113" font-family="monospace" font-size="17" fill="#2DD4BF" text-anchor="middle" font-weight="700">&lt;/&gt;</text>
    <rect x="460" y="96" width="30" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="460" y="110" width="20" height="7" rx="3.5" fill="#EEF2F6"/>
  </g>

  <!-- satellite: hosting (server) -->
  <g filter="url(#soft)">
    <rect x="30" y="210" width="100" height="74" rx="16" fill="#FFFFFF"/>
    <rect x="48" y="228" width="64" height="16" rx="5" fill="url(#gPurple)"/>
    <rect x="48" y="250" width="64" height="16" rx="5" fill="url(#gTeal)"/>
    <circle cx="56" cy="236" r="3" fill="#FFFFFF"/><circle cx="56" cy="258" r="3" fill="#FFFFFF"/>
  </g>

  <!-- satellite: support (headset) -->
  <g filter="url(#soft)">
    <rect x="432" y="212" width="100" height="74" rx="16" fill="#FFFFFF"/>
    <path d="M466 258 v-8 a16 16 0 0 1 32 0 v8" fill="none" stroke="url(#gMix)" stroke-width="3" stroke-linecap="round"/>
    <rect x="462" y="252" width="10" height="18" rx="4" fill="url(#gTeal)"/>
    <rect x="492" y="252" width="10" height="18" rx="4" fill="url(#gPurple)"/>
  </g>

  <!-- satellite: installation (gear) -->
  <g filter="url(#soft)">
    <rect x="100" y="344" width="100" height="72" rx="16" fill="#FFFFFF"/>
    <g transform="translate(134,380)">
      <circle r="13" fill="none" stroke="url(#gTeal)" stroke-width="3"/>
      <circle r="5" fill="url(#gTeal)"/>
      <g stroke="url(#gTeal)" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-18" x2="0" y2="-22"/><line x1="0" y1="18" x2="0" y2="22"/>
        <line x1="-18" y1="0" x2="-22" y2="0"/><line x1="18" y1="0" x2="22" y2="0"/>
      </g>
    </g>
    <rect x="156" y="372" width="30" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="156" y="386" width="20" height="7" rx="3.5" fill="#EEF2F6"/>
  </g>

  <!-- satellite: training (cap) -->
  <g filter="url(#soft)">
    <rect x="366" y="344" width="104" height="72" rx="16" fill="#FFFFFF"/>
    <path d="M400 374 l18 -8 l18 8 l-18 8 z" fill="url(#gPurple)"/>
    <path d="M407 380 v9 q11 7 22 0 v-9" fill="none" stroke="url(#gPurple)" stroke-width="2.6"/>
    <rect x="444" y="372" width="18" height="8" rx="4" fill="#E2E8F0"/>
    <rect x="444" y="386" width="12" height="7" rx="3.5" fill="#EEF2F6"/>
  </g>

  <circle cx="120" cy="104" r="4" fill="#2DD4BF"/><circle cx="450" cy="104" r="4" fill="#8B5CF6"/>
  <circle cx="86" cy="246" r="4" fill="#06B6D4"/><circle cx="476" cy="250" r="4" fill="#2DD4BF"/>
  <circle cx="150" cy="376" r="4" fill="#06B6D4"/><circle cx="416" cy="376" r="4" fill="#8B5CF6"/>
</svg>
