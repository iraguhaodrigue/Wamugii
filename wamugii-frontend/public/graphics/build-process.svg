<svg width="560" height="460" viewBox="0 0 560 460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="gMix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/><stop offset="0.55" stop-color="#06B6D4"/><stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <filter id="blurbig" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <circle cx="140" cy="150" r="95" fill="#2DD4BF" opacity="0.20" filter="url(#blurbig)"/>
  <circle cx="430" cy="330" r="110" fill="#8B5CF6" opacity="0.18" filter="url(#blurbig)"/>

  <!-- main build window: half built, half dashed placeholders -->
  <g filter="url(#soft)">
    <rect x="110" y="96" width="330" height="268" rx="18" fill="#FFFFFF"/>
    <path d="M110 114 a18 18 0 0 1 18 -18 h294 a18 18 0 0 1 18 18 v22 h-330 z" fill="#F1F5F9"/>
    <circle cx="136" cy="116" r="5" fill="#F87171"/><circle cx="154" cy="116" r="5" fill="#FBBF24"/><circle cx="172" cy="116" r="5" fill="#34D399"/>
    <!-- built blocks -->
    <rect x="138" y="158" width="132" height="34" rx="8" fill="url(#gMix)"/>
    <rect x="138" y="204" width="90" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="138" y="224" width="140" height="12" rx="6" fill="#EEF2F6"/>
    <rect x="138" y="258" width="72" height="26" rx="8" fill="url(#gTeal)"/>
    <!-- dashed placeholders (being built) -->
    <rect x="290" y="158" width="120" height="78" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/>
    <rect x="290" y="258" width="120" height="26" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="5 6"/>
    <rect x="138" y="304" width="272" height="12" rx="6" fill="#F1F5F9"/>
    <rect x="138" y="326" width="200" height="12" rx="6" fill="#F1F5F9"/>
  </g>

  <!-- floating component block lifting into place -->
  <g filter="url(#soft)">
    <rect x="372" y="72" width="108" height="96" rx="16" fill="url(#gMix)"/>
    <rect x="392" y="96" width="68" height="10" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <rect x="392" y="114" width="44" height="8" rx="4" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="426" cy="144" r="13" fill="#FFFFFF"/>
    <path d="M426 137 v14 M419 144 h14" stroke="url(#gPurple)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- code chip -->
  <g filter="url(#soft)">
    <rect x="64" y="244" width="96" height="68" rx="14" fill="#0F172A"/>
    <text x="112" y="288" font-family="monospace" font-size="28" fill="#2DD4BF" text-anchor="middle" font-weight="700">&lt;/&gt;</text>
  </g>

  <!-- gear / progress badge -->
  <g filter="url(#soft)">
    <rect x="368" y="300" width="150" height="72" rx="14" fill="#FFFFFF"/>
    <circle cx="400" cy="336" r="18" fill="url(#gTeal)"/>
    <path d="M392 336 l6 6 l12 -13" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="428" y="322" width="74" height="9" rx="4.5" fill="#E2E8F0"/>
    <rect x="428" y="340" width="50" height="8" rx="4" fill="#EEF2F6"/>
  </g>

  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.55">
    <path d="M160 278 C 120 300, 120 300, 118 312" fill="none"/>
    <path d="M426 168 C 430 200, 420 210, 410 216" fill="none"/>
  </g>
  <circle cx="540" cy="200" r="5" fill="#2DD4BF" opacity="0.7"/>
  <circle cx="80" cy="96" r="6" fill="#8B5CF6" opacity="0.5"/>
  <circle cx="300" cy="410" r="5" fill="#06B6D4" opacity="0.6"/>
</svg>
