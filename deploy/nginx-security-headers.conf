# ===========================================================================
#  WAMUGII TECH SOLUTIONS - security headers for Plesk nginx
# ===========================================================================
#
#  WHERE THIS GOES
#    Plesk > Domains > wamugii.kento.rw > Apache & nginx Settings
#          > "Additional nginx directives"
#    Paste everything below, then click OK / Apply.
#
#  WHY HERE AND NOT IN THE APP
#    These belong on the edge that terminates TLS and serves the HTML. The API
#    sets its own four headers in app/main.py (so they are present however the
#    API is reached), but HSTS and Content-Security-Policy only make sense on
#    the HTML responses, which nginx serves.
#
#  "always" ON EVERY add_header
#    Without it nginx drops the header on error responses (404, 500, 429).
#    A header that disappears exactly when something goes wrong is no use.
#
#  ORDER OF WORK (details in README-security-and-fixes.md)
#    1. Paste this in, Apply, confirm the site still works.
#    2. Leave the CSP in Report-Only for about a week.
#    3. Check the browser console for "Content-Security-Policy" reports.
#    4. Only then switch to the enforcing line (see CSP section below).
# ===========================================================================


# --- 1. Transport ----------------------------------------------------------
# Tell browsers to only ever use HTTPS for this domain and its subdomains.
#
# CAUTION: a browser remembers this for a year. Only keep it once you are sure
# every subdomain has a valid certificate. Do NOT add "preload" unless you
# intend to submit the domain to the HSTS preload list, which is very hard to
# undo.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;


# --- 2. The four cheap ones ------------------------------------------------
# Do not let the browser guess a file's type from its contents.
add_header X-Content-Type-Options "nosniff" always;

# Refuse to be put in a frame. frame-ancestors in the CSP below says the same
# thing for modern browsers; this covers older ones.
add_header X-Frame-Options "DENY" always;

# Send the full URL only to ourselves; other sites get the origin alone.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The site never asks for these, so refuse them outright.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


# --- 3. Hide what software is running --------------------------------------
# Plesk adds "X-Powered-By: PleskLin", which tells an attacker what to target
# and does nothing for visitors. This strips it from proxied responses.
#
# If the header still shows up after applying this, it is being added by PHP
# rather than the proxy -- see the README for the Plesk PHP setting
# (expose_php = off).
proxy_hide_header X-Powered-By;
fastcgi_hide_header X-Powered-By;

# Hides the nginx version number in the Server header. If Plesk rejects this
# line ("server_tokens not allowed here"), remove it -- it is the least
# important line in this file.
server_tokens off;


# --- 4. robots.txt and sitemap.xml ----------------------------------------
# Both used to return the SPA's index.html, because the React router's
# catch-all answered them. robots.txt now exists as a real file in the built
# site, so it is served directly. sitemap.xml is generated by the API from the
# published courses, so it is proxied.
#
# NOTE: adjust the proxy_pass port if the backend is not on 127.0.0.1:8000.
location = /robots.txt {
    add_header Content-Type "text/plain; charset=utf-8" always;
    try_files $uri =404;
}

location = /sitemap.xml {
    proxy_pass http://127.0.0.1:8000/api/v1/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The endpoint already sets application/xml; make sure nothing overrides it.
    proxy_hide_header Content-Type;
    add_header Content-Type "application/xml; charset=utf-8" always;
}


# --- 5. Content-Security-Policy -------------------------------------------
#
#  This is the list of places the site is allowed to load things from. It was
#  built by reading the code, not guessed:
#
#    script-src  'self'
#        Vite builds one external module script. The built index.html contains
#        no inline <script>, so no 'unsafe-inline' is needed here -- which is
#        the part of a CSP that actually stops injected script.
#
#    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com
#        'unsafe-inline' is required: the app sets inline style="" attributes
#        in many components (React style={{...}}), and a CSP cannot allow
#        those selectively. Removing it would mean rewriting every inline
#        style as a class. fonts.googleapis.com serves the Inter stylesheet
#        linked in index.html.
#
#    font-src    'self' https://fonts.gstatic.com data:
#        Google Fonts serves the actual .woff2 files from gstatic.
#
#    img-src     'self' data: blob: https:
#        Deliberately broad. Course cover images and company logos are URLs
#        typed into the admin screens, so they can point anywhere; YouTube
#        thumbnails come from i.ytimg.com. Narrow this to a fixed list only if
#        you decide to host all images yourself.
#
#    frame-src   youtube-nocookie.com, player.vimeo.com
#        Lesson videos. The player only ever builds these two embed URLs
#        (src/utils/videoEmbed.ts) and rejects anything else, so the list is
#        exactly those two.
#
#    connect-src 'self'
#        The API is called from the browser. If you ever move the API to a
#        different hostname, add it here or every request will be blocked.
#
#    frame-ancestors 'none' / object-src 'none' / base-uri 'self'
#        Nobody may frame us, no plugins, and injected markup cannot change
#        the page's base URL.
#
#  Lottie animations and the Lottie JSON files are same-origin, so 'self'
#  covers them.
#
#  --- STEP 1: start here (reports problems, blocks nothing) ---
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; upgrade-insecure-requests" always;

#  --- STEP 2: after a week with no reports, comment out the line above and
#              uncomment this one. The policy text is identical; only the
#              header name changes from Report-Only to enforcing. ---
# add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.youtube-nocookie.com https://player.vimeo.com; worker-src 'self' blob:; upgrade-insecure-requests" always;
